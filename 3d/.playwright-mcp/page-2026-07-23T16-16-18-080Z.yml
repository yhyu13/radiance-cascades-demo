  - heading "Reading the differences" [level=2] [ref=e88]
  - generic [ref=e89]: "Old vs PT (same legacy scene): luminance means 63.0 vs 60.0 — legacy volumetric GI approximates its own PT reference within ~5% mean energy, with the expected red/green wall bleeding on the correct sides. PT shows more variance noise at 200 frames. This is the old renderer behaving as designed."
  - generic [ref=e90]: "New vs Old/PT is NOT expected to match: the NEW image renders the ShaderToy parity Cornell (locked materials, enclosed room, sun only through animated ceiling blades, mirror sphere/box, black uncharted cylinders), not the legacy scene. Dominant green cast is physically correct there: the green wall (0.05, 0.95, 0.1) is sun-facing with ~9.5× the red wall's effective reflectance, and the red wall faces away from the sun. The legacy scene uses different geometry, lights, and its own calibration, so cross-scene pixel comparison is meaningless by design."
  - generic [ref=e91]: "Display mapping caveat: only the NEW 640×480 panel has exposure 8× + gamma 2.2 applied for human viewing (display policy; transport and G9-validated pixels remain linear). OLD and PT panels are shown as their renderers output them."
  - heading "What's next — Phase 8 (Cornell semantic parity milestone)" [level=2] [ref=e92]
  - generic [ref=e93]: "Run G0–G10 from a clean launch in one report; capture deterministic diagnostic artifacts; compare native reference output against a PT rendering of the parity scene as a non-blocking quality report (new apples-to-apples PT comparison, replacing this page's cross-scene caveat); document any deliberate differences from ShaderToy; no progression if a difference alters a locked invariant. Exit condition: all semantic gates pass in one report, no hidden calibration constants, stable indirect transport and color bleeding — labeled semantic parity, not general mesh support."
