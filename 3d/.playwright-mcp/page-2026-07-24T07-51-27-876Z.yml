  - generic [ref=e69]: "Analysis — the floor/center over-lighting is the reference kernel's coarse-bin small-light aliasing, not a port bug. The legacy Cornell's ceiling light is a small area source (0.5×0.5 quad in a 2×2 ceiling). The reference kernel's C0 has only 2×2 directions per hemisphere; when a bin's single ray hits the small light, that bin counts the full emission × its weight (~0.125) as if the light filled the whole bin's solid angle, while the light actually subtends a tiny fraction (~0.02 effective). PT samples thousands of directions and gets the correct small contribution. The result: RC over-lights surfaces under a small bright source (floor, back wall), while large sources (walls, ceiling) match PT within ~10%. The ShaderToy parity Cornell has no small area light (sun + sky only), so this aliasing never appeared there — it is inherent to applying the reference kernel to a scene with a small light, exactly the kind of finding a controlled comparison should surface."
  - generic [ref=e70]:
    - text: "Known integration limitations (documented, not hidden):"
    - list [ref=e71]:
      - listitem [ref=e72]: Box sides are uncharted in this integration (they receive direct light and cast shadows but no bounce feedback); box top faces are charted and lit. Box sides appear darker than PT.
      - listitem [ref=e73]: "Light model differs from OLD: NEW/PT use an emissive ceiling quad; OLD uses the legacy renderer's point light with its own intensity/falloff calibration. OLD's absolute brightness (63.0) is its own tuning and not a parity target."
      - listitem [ref=e74]: "Reflective-zero policy: the parity kernel's mirror surfaces are intentionally black; the legacy Cornell has no mirror objects, so this does not affect this scene."
  - heading "What this comparison proves" [level=2] [ref=e75]
  - generic [ref=e76]: "The new surface-RC kernel renders the old Cornell box from the old camera and reproduces the expected structure: red/green wall color bleeding, soft box shadows, ceiling-lit floor, and wall/ceiling energy matching PT within ~10%. The one systematic deviation (over-lit floor near the small light) is fully explained by the reference algorithm's coarse 2×2 angular discretization of a small bright source — a documented approximation, not a calibration hack or a port bug. The kernel is scene-generic at the layout level: integrating the legacy Cornell required a second chart layout (1/128 texel scale, 8 charts) and a second trace path, both validated against a CPU oracle."
