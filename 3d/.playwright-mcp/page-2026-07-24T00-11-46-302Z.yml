  - generic [ref=e72]: "Verdict. With scene and camera locked, the reference surface-RC kernel lands within ~13% of path-traced mean luminance and reproduces the same spatial energy distribution (green-dominant bounce from the sun-lit green wall, correct wall-color bleeding, correct shadow regions). Residual gaps are the expected approximation artifacts: 2×2 C0 angular bins blur shadowed regions (left third), and the locked reflective-zero policy makes the mirror sphere/box black where PT shows true reflections. No calibration floors, exposure hacks, or scene-specific multipliers exist anywhere in the reference path."
