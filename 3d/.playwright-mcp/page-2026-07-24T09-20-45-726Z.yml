  - heading "What's correct, what's limited" [level=2] [ref=f13e20]
  - generic [ref=f13e21]:
    - text: "Correct and matching PT: red/green wall color bleeding, white-wall and floor illumination, the bright spot under the ceiling light, box shadows on the floor, and overall wall/ceiling energy (left/right/top regions match PT within ~10%). The earlier garish blobs were a capture-path corruption ("
    - code [ref=f13e22]: LoadImageFromTexture
    - text: inflating the blue channel and zeroing patches on RGBA32F textures) — not an algorithm bug — and are now gone after reading with
    - code [ref=f13e23]: glGetTexImage
    - text: directly.
  - generic [ref=f13e24]:
    - text: "Limitation — dark boxes (diagnosed, not a bug): the two boxes are black in NEW while PT shows lit tops and dim sides. Three compounding reasons, all honest:"
    - list [ref=f13e25]:
      - listitem [ref=f13e26]: No direct-light path for an emissive source. The kernel's direct term D is directional-sun only (disabled here). The ceiling light is an emissive quad, so box tops receive light only through bounce feedback — they must wait for light to arrive via the cascade hierarchy and temporal feedback.
      - listitem [ref=f13e27]: Conservative merge visibility on small box geometry. The weighted merge rejects look-back candidates whose rays cross the small box rims, so upper-cascade light (present at C3–C5 on the box tops) does not propagate down to the C0/C1 box-top bins the final view reads. Large walls receive light easily; small elevated box tops do not. This is the technique's own trade-off, not a port error (CPU and GPU agree).
      - listitem [ref=f13e28]: Box sides are uncharted in this integration (they get direct light and cast shadows but no bounce), so sides are darker than PT. Box tops are charted.
    - text: Charting all box faces and relaxing nothing else is the honest next step to lift the boxes toward PT, tracked for the scene-generalization phase.
